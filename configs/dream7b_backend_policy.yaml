hybrid_scheduler:
  mode: observe_only
  enable_true_batch_decode: false
  enable_true_batch_prefill: false
  min_true_batch_slots: 4
  max_batch_wait_ms: 40
  max_padding_ratio: 0.20
  max_queue_depth: 256
  fallback_on_error: true
  fallback_on_latency_spike: true
  latency_spike_p95_ratio: 1.10

promotion_gate:
  minimum:
    failed_jobs: 0
    avg_bpu_loading_delta_vs_queue_min: -1.0
    tokens_per_second_delta_vs_queue_min_ratio: 0.15
    p95_ttft_degradation_max_ratio: 0.10
    p95_tpot_degradation_max_ratio: 0.10
    final_logits_time_regression_allowed: false
    consecutive_full_window_runs: 3
  preferred:
    avg_bpu_loading_min: 93.5
    tokens_per_second_delta_vs_queue_min_ratio: 0.20
    failed_jobs: 0

telemetry:
  required_metrics:
    - avg_bpu_loading
    - avg_nonzero_bpu_loading
    - tokens_per_second
    - ttft_ms
    - tpot_ms
    - latency_p50_ms
    - latency_p95_ms
    - latency_p99_ms
